<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141f" />
      <stop offset="100%" stop-color="#08090e" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Dark Container -->
  <rect width="64" height="64" rx="15" fill="url(#cardGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />

  <!-- Monogram AG -->
  <g font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" letter-spacing="-1">
    <!-- Letter A -->
    <text x="11" y="44" fill="#ffffff">A</text>
    <!-- Letter G with Glow & Soft Purple Shadow -->
    <text x="32" y="44" fill="#818cf8" filter="url(#glow)">G</text>
  </g>
</svg>